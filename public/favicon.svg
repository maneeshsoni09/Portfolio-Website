<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Glowing linear gradient for the cute 'm' character -->
    <linearGradient id="cuteMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fe2c9" />   <!-- glowing cyan -->
      <stop offset="50%" stop-color="#2dd4bf" />  <!-- mint green -->
      <stop offset="100%" stop-color="#06b1a3" /> <!-- deep teal -->
    </linearGradient>
    
    <!-- Blush gradient for soft cute cheeks -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Glowing circular ocean bubble background -->
  <circle cx="16" cy="16" r="15" fill="rgba(2, 12, 27, 0.9)" stroke="rgba(63, 226, 201, 0.45)" stroke-width="1.2" />
  
  <!-- Outer glowing rings for extra tech depth -->
  <circle cx="16" cy="16" r="12.5" stroke="rgba(63, 226, 201, 0.1)" stroke-width="1" stroke-dasharray="2, 2" />

  <!-- The cute 'm' shaped marine creature body -->
  <!-- We draw it using a path with a thick stroke and round caps for a chubby, friendly look -->
  <path 
    d="M 9.5,21.5 V 15.5 C 9.5,12 11.8,10 13.7,10 C 15.2,10 16,11 16,12.5 C 16,11 16.8,10 18.3,10 C 20.2,10 22.5,12 22.5,15.5 V 21.5" 
    stroke="url(#cuteMGrad)" 
    stroke-width="4.6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Tiny cute little flippers/fins at the bottom of the outer legs -->
  <path d="M 7,22.5 C 7,20.5 9,21.5 9.5,21.5" stroke="url(#cuteMGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 25,22.5 C 25,20.5 23,21.5 22.5,21.5" stroke="url(#cuteMGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Blushing Cheeks -->
  <circle cx="9.2" cy="15.8" r="2.2" fill="url(#blushGrad)" />
  <circle cx="22.8" cy="15.8" r="2.2" fill="url(#blushGrad)" />

  <!-- Huge, shiny anime eyes for maximum cuteness -->
  <!-- Left Eye -->
  <circle cx="11.8" cy="14.2" r="1.8" fill="#020c1b" />
  <circle cx="12.4" cy="13.6" r="0.6" fill="#ffffff" />
  <circle cx="11.4" cy="14.8" r="0.3" fill="#ffffff" />
  
  <!-- Right Eye -->
  <circle cx="20.2" cy="14.2" r="1.8" fill="#020c1b" />
  <circle cx="20.8" cy="13.6" r="0.6" fill="#ffffff" />
  <circle cx="19.8" cy="14.8" r="0.3" fill="#ffffff" />

  <!-- Tiny cute happy mouth -->
  <path d="M 15.2,15.8 Q 16,16.6 16.8,15.8" stroke="#020c1b" stroke-width="0.8" stroke-linecap="round" fill="none" />

  <!-- Bioluminescent sparkles & bubbles around the character -->
  <circle cx="6" cy="10" r="0.8" fill="#a3f3e6" opacity="0.6" />
  <circle cx="26" cy="12" r="0.6" fill="#a3f3e6" opacity="0.8" />
  <circle cx="27" cy="8" r="1" fill="none" stroke="#3fe2c9" stroke-width="0.4" opacity="0.7" />
  <circle cx="16" cy="5" r="0.5" fill="#3fe2c9" opacity="0.9" />
</svg>